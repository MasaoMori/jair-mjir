# 本番(独自ドメイン jairweb.jp、GitHub Pages で公開)。
baseURL: "https://jairweb.jp/"
title: "日本IR協会（JAIR）・MJIR"
defaultContentLanguage: ja
locale: ja
timeZone: Asia/Tokyo

# 旧Jekyll版のURLを維持するため、各ページは front matter の url で出力先を指定している。
# 一覧ページ(/posts/ など)や分類ページは作らない。
disableKinds: [section, taxonomy, term]
disablePathToLower: true

# 新しく作る投稿・ページの公開URL(front matter に url を書かない場合)。
# 旧Jekyll版から移した既存のページは、front matter の url が優先される。
# :slugorcontentbasename = front matter の slug、なければフォルダ名(バンドル)/ファイル名。
permalinks:
  page:
    posts: "/:year/:month/:day/:slugorcontentbasename/"
    pages: "/:slugorcontentbasename/"
ignoreFiles: ['\.DS_Store$']

# Hugo 0.170 は既定で .html のコンテンツファイルを拒否する。固定ページ10件(content/pages/*.html)は
# 自サイトの手書きHTMLなので許可する(.org だけ拒否のまま)。外部の第三者が書いたコンテンツを入れるなら見直すこと。
security:
  allowContent: ['! ^text/org$']

markup:
  goldmark:
    extensions:
      linkify: false   # 本文中の裸のURL・メールアドレスを自動でリンクにしない(Jekyll版と同じ)
    renderer:
      unsafe: true   # 本文中の生HTMLをそのまま出力する

outputs:
  home: [HTML, RSS]
outputFormats:
  RSS:
    baseName: feed   # /feed.xml (Jekyll版と同じ)

params:
  description: "日本インスティテューショナル・リサーチ協会（JAIR）と大学情報・機関調査研究会（MJIR）の統合サイト"
  home_title: "JAIR｜日本IR協会"
